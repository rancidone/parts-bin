[agent]
# Conversation events share the inventory PostgreSQL database.
# Local installs wait for live Responses by default. Async workers may submit
# in the background and collect through webhooks/polling instead.
background_responses = false

[agent.openai]
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-5.6"
# For public installations, register /agent/webhooks/openai on this OpenAI project.
# scripts.openai_webhook saves these to protected host-local configuration.
# webhook_secret = ""
# webhook_endpoint_id = ""

[db]
host = "localhost"
database = "parts_bin"
user = "parts_bin"
# Use a protected config file or libpq PGPASSFILE for the password.
# password = ""
port = 5432
sslmode = "prefer"

[digikey]
client_id = ""
client_secret = ""

[mcp]
# Read-only Streamable HTTP at /mcp. Disabled until explicitly configured.
enabled = false
public_url = "https://parts.example.com"
# Use a dedicated random token; never reuse the OpenAI key or commit this value.
token = ""
