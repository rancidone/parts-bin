[agent]
# Conversation events and threads share the inventory database by default.
conversation_db_path = "data/parts.db"

[agent.openai]
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-5.6"

[agent.local]
# An OpenAI-compatible local inference endpoint. Include /v1 if required.
base_url = "http://localhost:8080/v1"
api_key = ""
model = "local"
supports_native_tools = true

[agent.codex]
# Codex reads Parts Bin MCP from its standard ~/.codex/config.toml.
command = "codex exec"
# Optional per-app model override; the command remains generic.
model = "gpt-5.6-luna"

[db]
path = "data/parts.db"

[digikey]
client_id = ""
client_secret = ""

[jlcparts]
db_path = "data/jlcparts.sqlite3"
min_free_bytes = 4294967296
max_sqlite_bytes = 21474836480
