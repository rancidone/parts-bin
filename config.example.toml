[agent]
# Conversation events share the inventory PostgreSQL database.

[agent.openai]
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-5.6"

[db]
host = "localhost"
database = "parts_bin"
user = "parts_bin"
# Use a protected config file or libpq PGPASSFILE for the password.
# password = ""
port = 5432
sslmode = "prefer"

[digikey]
client_id = ""
client_secret = ""
