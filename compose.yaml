services:
  parts-bin:
    build: .
    init: true
    ports:
      - "8000:8000"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
      # Persist native Codex rollout files so stored thread IDs remain
      # resumable after the app container is recreated.
      - ./data/codex-sessions:/home/appuser/.codex/sessions
      - ./codex.config.toml:/home/appuser/.codex/config.toml:ro
      # Use the host's ChatGPT-linked Codex login without exposing the rest of
      # the host Codex profile to the container.
      # - ${CODEX_HOME:?Set CODEX_HOME to your host Codex directory}/auth.json:/home/appuser/.codex/auth.json:ro
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      LOG_FILE: /app/data/parts_bin.log
      TELEMETRY_LOG_FILE: /app/data/telemetry.jsonl
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
