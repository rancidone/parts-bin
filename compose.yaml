services:
  parts-bin:
    build: .
    init: true
    stop_grace_period: 5m30s
    ports:
      - "8000:8000"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      LOG_FILE: /app/data/parts_bin.log
      TELEMETRY_LOG_FILE: /app/data/telemetry.jsonl
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  parts-bin-worker:
    build: .
    init: true
    command: [python, -m, agent_runtime.worker]
    stop_grace_period: 5m30s
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      LOG_FILE: /app/data/worker.log
      TELEMETRY_LOG_FILE: /app/data/telemetry.jsonl
    healthcheck:
      test: [CMD, python, -m, agent_runtime.worker, --health]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped
