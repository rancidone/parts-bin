services:
  parts-bin:
    build: .
    container_name: parts-bin
    ports:
      - "8000:8000"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/data
    environment:
      LOG_LEVEL: INFO
      TELEMETRY_LOG_FILE: /data/telemetry.jsonl
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.parts-bin.rule=Host(`parts.brownfamily.house`)"
      - "traefik.http.routers.parts-bin.entrypoints=https"
      - "traefik.http.services.parts-bin.loadbalancer.server.port=8000"
    restart: unless-stopped

networks:
  default:
    name: proxy
    external: true
