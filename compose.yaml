services:
  parts-bin:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      LOG_FILE: /app/data/parts_bin.log
      TELEMETRY_LOG_FILE: /app/data/telemetry.jsonl
    restart: unless-stopped
